<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AprilTag Field Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="sidebar">
      <h2>AprilTag Editor</h2>
      <label>Import Custom Layout:</label>
      <input
        id="fileinput"
        type="file"
        accept=".json"
        onchange="importJSON(event)"
      />
      <label>Import FRC Layout:</label>
      <input
        id="frcFileInput"
        type="file"
        accept=".json"
        onchange="importFRCLayout(event)"
      />
      <label>Name: <input type="text" id="fieldName" /></label>
      <label>Width (in): <input type="number" id="fieldWidth" /></label>
      <label>Length (in): <input type="number" id="fieldLength" /></label>

      <h3>Add/Edit Tag</h3>
      <div class="tag-form">
        <label>ID: <input type="number" id="tagId" /></label>
        <label>X (in): <input type="number" id="tagX" /></label>
        <label>Y (in): <input type="number" id="tagY" /></label>
        <label>Z (in): <input type="number" id="tagZ" /></label>
        <label>Roll (deg): <input type="number" id="tagRoll" /></label>
        <label>Pitch (deg): <input type="number" id="tagPitch" /></label>
        <label>Yaw (deg): <input type="number" id="tagYaw" /></label>
        <button onclick="addOrUpdateTag()">Save Tag</button>
      </div>

      <button onclick="downloadJSON()">Export JSON</button>

      <h3>FRC Layout Alignment</h3>
      <div id="frcAlignmentSection" style="display: none">
        <label
          >Reference Tag ID:
          <select id="referenceTagId">
            <option value="">Select a common tag...</option>
          </select>
        </label>
        <button onclick="translateToFRCLayout()">Align to FRC Layout</button>
        <div
          id="frcTagInfo"
          style="color: #888; font-size: 0.9em; margin-top: 0.5rem"
        ></div>
      </div>

      <div class="tag-list" id="tagList"></div>
      <div
        id="frcTagsInfo"
        style="color: #888; font-size: 0.85em; margin-top: 1rem"
      ></div>
    </div>
    <canvas id="canvas"></canvas>

    <script src="main.js"></script>
    <script src="quaternion.js"></script>
    <script src="tags.js"></script>
    <script src="field.js"></script>
    <script src="io.js"></script>
    <script src="alignment.js"></script>
  </body>
</html>
